<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinFlow | Money in Motion</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <main class="main-content">

        <h1>FinFlow</h1>
        <p>Money in Motion</p>

    </main>
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>

<aside class="sidebar">

    <div class="brand">

        <div class="brand-logo">
            FF
        </div>

        <div class="brand-text">
            <h1>FinFlow</h1>
            <p>Money in Motion</p>
        </div>

    </div>


    <nav class="sidebar-nav">

        <button class="nav-item active" data-view="home">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </button>

        <button class="nav-item" data-view="transactions">
            <span class="nav-icon">💳</span>
            <span>Transactions</span>
        </button>

        <button class="nav-item" data-view="budget">
            <span class="nav-icon">🎯</span>
            <span>Budget &amp; Goals</span>
        </button>

        <button class="nav-item" data-view="coach">
            <span class="nav-icon">✨</span>
            <span>Smart Coach</span>
        </button>

    </nav>

</aside>

<main class="main-content">

    <section id="home-view" class="page-view active-view">
    <header class="page-header">
        <div>
            <p class="eyebrow">
                FINANCIAL DASHBOARD
            </p>
            <h2>
                Good Morning! 👋
            </h2>

            <p class="page-subtitle">
                Here's your financial snapshot.
            </p>
        </div>
    </header>


    <section class="hero-card">
        <div class="hero-content">
            <p class="hero-label">
                FINFLOW
            </p>

            <h3>
                Your money has a direction.
            </h3>

            <p>
                Track today. Plan tomorrow.
            </p>

            <button class="primary-button">
                View Insights →
            </button>

        </div>
    </section>


    <section class="summary-grid">
        <article class="stat-card">
            <p class="stat-label">
                Total Balance
            </p>

            <h3>
                ₹0.00
            </h3>
        </article>

        <article class="stat-card">
            <p class="stat-label">
                Total Income
            </p>

            <h3>
                ₹0.00
            </h3>
        </article>


        <article class="stat-card">
            <p class="stat-label">
                Total Expenses
            </p>
            <h3>
                ₹0.00
            </h3>
        </article>

        <article class="stat-card">
            <p class="stat-label">
                Savings Rate
            </p>
            <h3>
                0%
            </h3>
        </article>

    </section>
</section>
</main>
